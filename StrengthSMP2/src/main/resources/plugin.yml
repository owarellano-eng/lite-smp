name: StrengthSMP
version: 1.4.0
main: com.dozer.strengthsmp.StrengthSMP
api-version: '26.1'
author: Dozer
description: Strength SMP with kill progression, Strength Crystals and a random assigned item per player.
commands:
  strength:
    description: View your Strength or use admin management commands.
    usage: /strength
  withdraw:
    description: Withdraw Strength into droppable Strength Crystals.
    usage: /withdraw [amount]
  activate:
    description: Strength 5 only. Triggers Overdrive.
    usage: /activate
  strengthitem:
    description: Give yourself or another player Strength Crystals.
    usage: /strengthitem [player] [amount]
permissions:
  strengthsmp.admin:
    description: Allows giving Strength Crystals and setting player Strength.
    default: op
